# Use in-memory H2 during tests to avoid connecting to external MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let JPA create and drop schema during tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway migrations during unit/integration tests
spring.flyway.enabled=false

# Ensure Spring's SQL initialization uses the embedded DB if needed
spring.sql.init.mode=always

# JWT settings required by JwtUtil
jwt.secret=testtesttesttesttesttesttesttesttesttesttesttesttesttesttesttest
jwt.expiration=86400000
