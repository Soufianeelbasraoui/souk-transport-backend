name: Java CI with Maven
on:
  push:
    branches:
      - main
      - develop
      - feature/controllers
      - feature/database
      - feature/dto
      - feature/entities
      - feature/mappers
      - feature/repositories
      - feature/security
      - feature/services

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write   # required to submit dependency graph snapshots

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test with Maven
        run: ./mvnw -B clean verify

