services:

  mysql:
    image: mysql:8.0
    container_name: souktransport-mysql

    environment:
      MYSQL_DATABASE: souktransport
      MYSQL_ROOT_PASSWORD: "1234"

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - souktransport-network


  redis:
    image: redis:7
    container_name: souktransport-redis

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - souktransport-network


  app:
    build: .
    container_name: souktransport-backend

    ports:
      - "8082:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/souktransport?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: "1234567890123456789012345678901234567890123456789012345678901234"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_started

    restart: unless-stopped

    networks:
      - souktransport-network

volumes:
  mysql_data:
  redis_data:

networks:
  souktransport-network:
    driver: bridge